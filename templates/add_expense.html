{% extends "layout.html" %}

{% block title %}Add Expense{% endblock %}

{% block content %}
<h1>Add Expense</h1>

<div class="card">
    <form method="POST">
        <input type="text" name="item" placeholder="Item name" required>
        <input type="number" name="amount" step="0.01" placeholder="Amount" required>
        <button class="primary">Add Expense</button>
    </form>
</div>
{% endblock %}
