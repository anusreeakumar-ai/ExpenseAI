{% extends "layout.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<h2>User Profile</h2>

<div class="card">
    <form method="POST" action="/profile">

        <label>Full Name</label>
        <input type="text" name="full_name"
               value="{{ profile.full_name if profile else '' }}" required>

        <label>Monthly Income (₹)</label>
        <input type="number" name="income" step="0.01"
               value="{{ profile.income if profile else '' }}">

        <label>Monthly Budget (₹)</label>
        <input type="number" name="monthly_budget" step="0.01"
               value="{{ profile.monthly_budget if profile else '' }}">

        <label>Savings Goal (₹)</label>
        <input type="number" name="savings_goal" step="0.01"
               value="{{ profile.savings_goal if profile else '' }}">

        <label>Preferred Categories (comma separated)</label>
        <input type="text" name="preferred_categories"
               value="{{ profile.preferred_categories if profile else '' }}">

        <button class="primary">Save Profile</button>

    </form>
</div>

{% endblock %}
