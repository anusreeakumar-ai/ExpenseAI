<!DOCTYPE html>
<html>
<head>
    <title>Your Bills</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>Your Bills</h2>
<div class="filter-bar">
    <form method="GET" action="/bills">

        <input type="text" name="search" placeholder="Search by category">

        <select name="category">
            <option value="">All Categories</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
        </select>

        <select name="sort">
            <option value="desc">Newest First</option>
            <option value="asc">Oldest First</option>
        </select>

        <button type="submit" class="primary">Apply</button>

    </form>
</div>

<div class="bill-grid">
    {% for bill in bills %}
    <div class="bill-card">

        <a href="/bill-view/{{ bill.id }}">
            <img src="/bill/{{ bill.image_path }}" alt="Bill Image">
        </a>

        <div class="bill-info">
            <h4>{{ bill.category }}</h4>
            <p>Date: {{ bill.bill_date }}</p>

            <div class="bill-actions">
                <a href="/bill-view/{{ bill.id }}" class="view-btn">View</a>

                <a href="/delete-bill/{{ bill.id }}"
                   class="delete-btn"
                   onclick="return confirm('Delete this bill?')">
                   Delete
                </a>
            </div>
        </div>

    </div>
    {% else %}
    <p>No bills found.</p>
    {% endfor %}
</div>



<a href="/dashboard">⬅ Back to Dashboard</a>

</body>
</html>
