{% extends "layout.html" %}

{% block content %}

<div style="max-width:600px; margin:auto; padding:30px;">

    <h2 style="margin-bottom:20px;">⚙ Account Settings</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="
                    padding:12px;
                    margin-bottom:15px;
                    border-radius:8px;
                    background-color:#1e2a47;
                    border-left:5px solid #4CAF50;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div style="
        background:#0f1c35;
        padding:25px;
        border-radius:12px;
        box-shadow:0px 0px 15px rgba(0,0,0,0.3);
    ">

        <form method="POST">

            <label style="font-weight:500;">Daily Spending Limit (₹)</label>

            <input type="number"
                   step="0.01"
                   name="daily_limit"
                   value="{{ daily_limit }}"
                   required
                   style="
                        width:100%;
                        padding:12px;
                        margin-top:8px;
                        margin-bottom:20px;
                        border-radius:8px;
                        border:1px solid #2d3c5e;
                        background:#08122b;
                        color:white;
                   ">

            <button type="submit"
                    style="
                        padding:12px 20px;
                        border:none;
                        border-radius:8px;
                        background:#4CAF50;
                        color:white;
                        cursor:pointer;
                    ">
                Update Limit
            </button>

        </form>
    </div>

    <br>

    <a href="{{ url_for('dashboard') }}" style="color:#9c6eff;">
        ← Back to Dashboard
    </a>

</div>

{% endblock %}
