{% extends "layout.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}
<h2>Edit Expense</h2>

<form method="POST">

<label>Item</label>
<input type="text" name="item" value="{{expense.item}}" required>

<label>Amount</label>
<input type="number" step="0.01" name="amount" value="{{expense.amount}}" required>

<label>Category</label>
<select name="category">

<option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food</option>

<option value="Travel" {% if expense.category == "Travel" %}selected{% endif %}>Travel</option>

<option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>Shopping</option>

<option value="Utilities" {% if expense.category == "Utilities" %}selected{% endif %}>Utilities</option>

<option value="Personal Care" {% if expense.category == "Personal Care" %}selected{% endif %}>Personal Care</option>

<option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>

</select>

<label>Date</label>
<input type="date" name="date" value="{{expense.date}}" required>

<br><br>

<button type="submit">Update Expense</button>

</form>
{% endblock %}
